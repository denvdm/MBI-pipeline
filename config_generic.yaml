# Configuration for the MBI pipeline
#
# Notes
# - Paths can be absolute, relative, use ~, or reference environment variables like ${PROJECT_ROOT}.
# - The core pipeline consumes a generic feature table (features_file + feature_map_file).
# - The FreeSurfer section is optional and only used by the included adapter script.

paths:
  # Directory containing PET/atlas/GM/LUT resources used for PET-weight extraction
  maps_dir: "${MAPS_DIR}"

  # Optional: directory containing FreeSurfer-exported stats tables (only needed if you run the
  # FreeSurfer adapter script to produce features_wide.tsv + feature_map.tsv).
  freesurfer_stats_dir: "${FREESURFER_STATS_DIR}"

inputs:
  # PET / maps (used in PET-weight extraction). If null, defaults are resolved relative to paths.maps_dir.
  pet_file: null
  atlas_file: null
  gm_file: null
  lut_file: null

  # Generic inputs (required for normative deviations)
  features_file: "${FEATURES_FILE}"            # e.g. out/features/features_wide.tsv
  feature_map_file: "${FEATURE_MAP_FILE}"      # e.g. out/features/feature_map.tsv

  # Optional: demographics file used by the FreeSurfer adapter (ignored by the core pipeline)
  demographics_file: "${DEMOGRAPHICS_FILE}"

  # Column mapping for the generic feature table
  colmap:
    id: "id"
    age: "age"
    sex: "sex"
    scanner: "scanner"
    icv: "icv_raw"        # set to null if not present

  # Optional: FreeSurfer export filenames (only used by the FreeSurfer adapter)
  freesurfer_files:
    lh_thickness: "lh.thickness.UKBB.txt"
    rh_thickness: "rh.thickness.UKBB.txt"
    lh_area: "lh.area.UKBB.txt"
    rh_area: "rh.area.UKBB.txt"
    aseg: "subcorticalstats.UKBB.txt"

  # Optional overrides if you run stages out of order
  # deviations_z_long: "/path/to/normdev/deviations_z_long.txt"
  # pet_weights: "/path/to/pet/pet_fdg_featMedians.txt"
  # feat_sizes: "/path/to/normdev/feats_avgSize.txt"

  # Optional: per-feature test-retest ICC table (columns: modality, region, icc).
  # Activates the ICC gate in stage 03 together with mbi.icc_min.
  # feat_icc: "/path/to/feature_icc.tsv"

split:
  # Discovery/replication assignment. Deterministic in the subject id, so a
  # subject's HALF never changes when the cohort grows, and there is no split
  # file to go stale. Two values fully specify it; extras/make_split.R writes it
  # out for downstream analyses, and stage 02 recomputes the same assignment
  # rather than reading that file, so the two cannot fall out of step.
  #
  # WHY NOT A STRATIFIED DRAW. sample() reassigns every subject whenever N
  # changes, so a regenerated split moves people between halves; and its random
  # stream changed at R 3.6, so a seed does not pin a split across environments.
  # Freezing the draw in a file stops the movement but starts the drift: under
  # an id-membership rule every subject added afterwards silently lands on the
  # held-out side, and the realised discovery fraction falls with each cohort
  # refresh. Hashing the id removes both failure modes. What it gives up is
  # stratification; make_split.R reports the realised balance by sex and age
  # decile so that is checked rather than assumed.

  mode: none            # none | hash. "hash" enables the assignment.

  label: ""             # names THIS split. Changing it draws a new one,
                        # which is its only purpose and not a tuning knob: a
                        # label changed after outcomes have been inspected is a
                        # split chosen against a result. Record any change in
                        # extras/SELECTION_RULE.md.

  discovery_frac: 0.7   # target share in the discovery half.

  fit_on: all           # all | discovery. WHO THE NORMATIVE MODELS ARE FITTED
                        # ON, and nothing else: z-scores are computed for every
                        # subject either way, everyone who clears the inclusion
                        # rules is scored, and the index is built identically
                        # for both halves.
                        #
                        # "all" is the default and is a considered choice. The
                        # normative model contains no outcome — only age, sex,
                        # scanner and optionally ICV — so fitting it on the
                        # whole cohort is not leakage with respect to any later
                        # association test, it is simply the more precise
                        # estimate of the norms. The discovery/replication logic
                        # belongs where an outcome enters, which is downstream
                        # of this pipeline; that is what the written assignment
                        # is for.
                        #
                        # "discovery" is a SENSITIVITY ARM: it asks whether the
                        # deviations depend on who the norms were built from. It
                        # CHANGES EVERY INDEX VALUE, so run it into its own
                        # output directory and do not mix its scores with the
                        # reported ones.

normative:
  k_age: 10
  use_site_RE: true
  sex_interact: false

  variance_model: true    # LOCATION-SCALE normative model (mgcv gaulss): fit
                          # sigma(age, sex, scanner) as well as the mean, so
                          # every subject is z-scored against their own expected
                          # spread. With one scalar sigma per feature instead,
                          # |z| is inflated at the ages where that feature is
                          # more variable — on simulated data with an
                          # age-increasing SD, sd(z) of 0.70 / 0.95 / 1.27 across
                          # age tertiles, versus 1.00 / 0.99 / 1.01 under gaulss.
                          # This matters more for MBI than for a mean index:
                          # MBI is a spatial CONTRAST, so where the
                          # variance-by-age slope differs between regions the
                          # inflation is spatially patterned, and spatially
                          # patterned inflation of z is indistinguishable from
                          # genuine deviation topography.
                          # false = location-only fit; a diagnostic comparison,
                          # not an alternative specification.

  k_age_scale: 5          # basis dimension for the age smooth in the VARIANCE
                          # model. Deliberately smaller than k_age: a variance
                          # curve does not support 10 basis functions at this N,
                          # and over-flexible scale models are the usual cause of
                          # gaulss convergence failures.

  edf_max_frac: 0.8       # DEGENERATE-FIT GATE, high-edf arm. A feature is
                          # dropped when the total edf of the mean model's age
                          # smooth(s) exceeds edf_max_frac * k_age per smooth —
                          # 8.0 at the defaults. Catches an age smooth that has
                          # absorbed the signal, whose residual is no longer a
                          # deviation.

  # min_r2: 0.02          # DEGENERATE-FIT GATE, low-r2 arm. OFF unless set.
                          # When set, also drops a feature with edf_age < 1.5
                          # and r2 below this value. Off by default because a
                          # region whose morphometry barely depends on age still
                          # yields a valid z-score, and a low r2 is a fact about
                          # the covariates rather than evidence of a degenerate
                          # fit. It matters here more than it would for a mean
                          # index: the arm selects on age-dependence, which is
                          # spatially patterned, and MBI is a spatial contrast,
                          # so what it removes is a spatially patterned subset
                          # of the feature set — and the feature set becomes an
                          # outcome of model fitting rather than a
                          # specification.

  # Modalities that should include ICV as a covariate if icv is available
  icv_modalities: ["SA", "SubVol"]

runtime:
  n_cores: 12

outputs:
  write_raw_values: false   # feats_rawVals.txt is a verbatim copy of the input
                            # feature table and the largest file stage 02 can
                            # produce. Nothing in this pipeline reads it. Set
                            # true if something downstream of yours does; the
                            # skip is announced in the stage log either way.

mbi:
  # Seven keys, listed below. Weights are pooled globally over all features and
  # the map -> weight transform is additive; neither is configurable, and stage
  # 03 warns if the config carries keys it does not read.

  emphasis: 1             # THE ONLY PARAMETER THAT CHANGES MBI.
                          # u -> sign(u)*|u|^emphasis, applied before the weight
                          # mapping. At 1 the transform is off and the weights
                          # are affine in the map's robust z, so MBI is a plain
                          # linear contrast along the biological gradient.
                          #
                          # WHY 1 IS THE DEFAULT. At emphasis = 1 the index has
                          # NO free parameters at all: ratio is algebraically
                          # inert, clamp_z is a rail, beta is 0. There is
                          # nothing left that a reader could suspect of having
                          # been tuned. It is also the least concentrated
                          # setting, which matters because concentration is the
                          # failure mode this construction is most exposed to.
                          #
                          # Above 1, since |u| <= 1, the transform shrinks
                          # typical-demand regions toward the mean weight while
                          # leaving both extremes at +/-1: convex, sign-symmetric
                          # emphasis on the tails, encoding a hypothesis that
                          # demand relates non-linearly to vulnerability. It
                          # buys that hypothesis at a real cost in concentration
                          # -- on the reference cohort, N_eff fell from 43.8 at
                          # emphasis 1 to 20.6 at 2 and 12.4 at 3, while the
                          # largest single feature share rose from 5.3% to 11.8%
                          # to 19.4%. Raise it only with a stated reason.
                          # SENSITIVITY TO REPORT: emphasis in {1, 2, 3}.

  clamp_z: 3              # clamp the robust-z of the map at +/- this many robust
                          # SDs so no outlier parcel can stretch the weight range.
                          # Intended as a safety rail, not a design parameter:
                          # check the realised weight ratio reported by stage 03,
                          # and prefer a value at which nothing on your map
                          # reaches the bound. A clamp that engages on one tail
                          # only is a one-sided distortion of the weights.

  ratio: auto             # nominal max:min of the weight vector. ALGEBRAICALLY
                          # INERT for MBI: residualising on GBI removes the term
                          # it scales, and it cancels in the influence shares, so
                          # it cannot be tuned to change a result — see
                          # extras/verify_invariance.R.
                          # "auto" reads it off the supplied map, so the weights
                          # span the same multiplicative range the biology does
                          # and there is no number here to maintain. A hard-coded
                          # value would have to be re-derived by hand whenever the
                          # map changed, and would go stale silently if nobody
                          # did. A literal number is accepted, and is what
                          # verify_invariance.R uses to sweep the parameter.
                          # Stage 03 reports both the resolved value and the
                          # REALISED contrast, which is lower whenever the clamp
                          # does not engage on both tails.

  beta: 0                 # size weighting exponent on tissue volume (mm^3).
                          # 0: every standardised regional deviation is one
                          # observation of the spatial pattern — a topography
                          # question. 1: volume weighting, which is
                          # parcellation-invariant but answers a burden question
                          # and concentrates influence on large structures.
                          # SENSITIVITY TO REPORT: beta in {0, 1}.

  coverage_thr: 0.80      # per-(subject, modality) completeness required for a
                          # subject to contribute that modality.

  required_modalities: ["CT", "SA", "SubVol"]
                          # Modalities a subject must contribute to receive a
                          # score at all. coverage_thr decides whether a subject
                          # contributes a GIVEN modality; it does not decide
                          # whether they have enough modalities for the index to
                          # mean the same thing. Because MBI is a contrast, a
                          # subject scored on CT+SA only carries a DIFFERENT
                          # linear functional, not a noisier estimate of the same
                          # one - on simulated data, r = 0.92 against the full
                          # index when SubVol is missing and r = 0.77 when CT is.
                          # null scores everyone who clears coverage_thr on at
                          # least one modality; stage 03 then warns.

  # z_implausible: 10     # OFF unless set. A deviation whose magnitude exceeds
                          # this is set to MISSING before aggregation, not
                          # clipped. Nothing else bounds z: stage 02 computes it
                          # from the RAW value by design, and clamp_z above
                          # bounds the MAP rather than the deviation, so a failed
                          # segmentation otherwise enters the contrast at full
                          # weight. On a 143-feature build at N_eff 52 a single
                          # feature at |z| = 56 moved that subject's index by
                          # 15 SD.
                          #
                          # MISSING RATHER THAN CLIPPED, because clipping asserts
                          # a value the data does not support and the index then
                          # propagates it: on the same build, clipping at 5 still
                          # left the artefact moving the subject by 1.7 SD and at
                          # 10 by 3.0 SD, where setting it to NA moved them by
                          # 0.36 SD — the renormalisation from dropping one
                          # feature of 143. coverage_thr and required_modalities
                          # then decide whether the subject is still scored.
                          #
                          # SET IT OUTSIDE THE BIOLOGICAL RANGE, NOT AT ITS EDGE,
                          # and set it from the SIGN STRUCTURE of your own tail
                          # rather than from a percentile. Real pathology lowers
                          # thickness, area and volume, so genuine extreme
                          # deviations are NEGATIVE; an artefact tail is usually
                          # one-sided the other way. On the reference cohort the
                          # fraction of the tail that is negative falls from 0.42
                          # above |z| = 5 to 0.02 above 10 and 0.00 above 15, so
                          # a bound of 10 cuts a population that is ~96%
                          # artefact while a bound of 6 would be ~66% real
                          # severe atrophy. Stage 03 warns if this is unset and
                          # the cohort contains |z| above 10.

  subvol_min_mm3: 1000    # drop SubVol structures below this volume (mm^3);
                          # single source of truth for stages 03, 04 and the
                          # sweep. Absolute, not a quantile: invariant to
                          # upstream region filtering, so this gate and the
                          # map-validity filter in align_feature_set() commute.
                          # Set it from your own segmentation's volume
                          # distribution.

  # Optional: per-feature test-retest ICC gate across ALL modalities, for
  # cohorts with a repeat-imaging visit. A direct reliability measure, and a
  # better instrument than using size as a proxy for it. BOTH keys are required
  # to activate it -- inputs.feat_icc (a table with columns modality, region,
  # icc) and mbi.icc_min.
  # icc_min: 0.70

qc:
  mods_use: ["CT", "SA", "SubVol"]
